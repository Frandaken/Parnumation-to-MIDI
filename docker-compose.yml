services:
  frontend:
    image: ghcr.io/frandaken/parnumation-to-midi-frontend:latest
    container_name: app-frontend
    ports:
      - 80:80
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - app-network

  backend:
    image: ghcr.io/frandaken/parnumation-to-midi-backend:latest
    container_name: app-backend
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      app-network:
        aliases:
          - backend
          - app-backend

networks:
  app-network:
    driver: bridge
